services:
  - type: web
    name: scribe-study-app
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && NITRO_PRESET=node-server npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
